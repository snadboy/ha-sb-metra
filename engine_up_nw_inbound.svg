<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<g transform="translate(32,34) scale(1.35) translate(-32,-34)">
  <!-- Metra F40PH, nose right (inbound/east). Transparent background;
       artwork kept inside the inscribed circle to survive round marker crops. -->
  <g>
    <!-- black underframe + fuel tank -->
    <rect x="9" y="40" width="45" height="2.6" fill="#111111"/>
    <rect x="26" y="42" width="10" height="3" rx="1" fill="#1c1c1c"/>
    <!-- trucks + wheels -->
    <rect x="12" y="42.5" width="11" height="3.4" rx="1.6" fill="#222222"/>
    <rect x="40" y="42.5" width="11" height="3.4" rx="1.6" fill="#222222"/>
    <g fill="#0d0d0d">
      <circle cx="14.5" cy="46" r="2.6"/><circle cx="20.5" cy="46" r="2.6"/>
      <circle cx="42.5" cy="46" r="2.6"/><circle cx="48.5" cy="46" r="2.6"/>
    </g>
    <g fill="#555555">
      <circle cx="14.5" cy="46" r=".9"/><circle cx="20.5" cy="46" r=".9"/>
      <circle cx="42.5" cy="46" r=".9"/><circle cx="48.5" cy="46" r=".9"/>
    </g>
    <!-- blue body, sloped cab nose to the right -->
    <path d="M9 24 h38 l5.5 3.5 q2.5 2 2.5 4.5 v6 q0 2 -2 2 h-42 q-2 0 -2 -2 z" fill="#0050a0"/>
    <!-- red roof -->
    <path d="M9 21.5 h36 q2 0 3.5 1.2 l2 1.6 -41.5 0 z" fill="#e03a3e"/>
    <!-- roof vents -->
    <g stroke="#a02226" stroke-width="1">
      <line x1="14" y1="22.6" x2="14" y2="24"/><line x1="19" y1="22.6" x2="19" y2="24"/>
      <line x1="24" y1="22.6" x2="24" y2="24"/><line x1="29" y1="22.6" x2="29" y2="24"/>
      <line x1="34" y1="22.6" x2="34" y2="24"/><line x1="39" y1="22.6" x2="39" y2="24"/>
    </g>
    <!-- windshield -->
    <path d="M46.5 25 l4.2 2.8 q.8 .6 .9 1.2 l-5.1 0 z" fill="#bcd4ec"/>
    <!-- red/white striped nose panel -->
    <path d="M52.6 30.5 q2.4 1.6 2.4 4v3.5 q0 2 -2 2 h-3 v-9.5 z" fill="#e03a3e"/>
    <g stroke="#ffffff" stroke-width="1.1">
      <line x1="50.6" y1="33" x2="54.6" y2="37"/>
      <line x1="50.6" y1="36.5" x2="53.6" y2="39.5"/>
    </g>
    <!-- white stripe band along the sill -->
    <rect x="9" y="37.2" width="41" height="2.2" fill="#ffffff"/>
    <!-- Metra wordmark -->
    <text x="27" y="34.6" font-family="Helvetica, Arial, sans-serif" font-size="7.4"
          font-weight="bold" font-style="italic" fill="#1a1a1a" text-anchor="middle">Metra</text>
    <!-- headlight -->
    <circle cx="53.4" cy="31.6" r="1.2" fill="#ffe066"/>
  </g>
</g>
</svg>
