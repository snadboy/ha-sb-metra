  cards:
  - type: heading
    heading: Expander Card test
    heading_style: title
    icon: mdi:arrow-expand-vertical
  - type: heading
    heading: Nested expanders for all 11 lines live on their own subview
    heading_style: subtitle
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Open Metra Expanders
    icon: mdi:arrow-expand-vertical
    button_action:
      tap_action:
        action: navigate
        navigation_path: /dashboard-monitor/metra-expander
    grid_options:
