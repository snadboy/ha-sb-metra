type: sections
title: Metra UI tests
path: metra-tabs
icon: mdi:tab
max_columns: 2
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Tabbed Card test
    heading_style: title
    icon: mdi:tab
  - type: heading
    heading: Same content as the Metra Maps pop-ups, shown inline in tabs · compare, then keep one
    heading_style: subtitle
  - type: custom:tabbed-card
    attributes:
      minWidth: true
      isMinWidthIndicator: true
    tabs:
    - attributes:
        label: BNSF
      card:
        type: vertical-stack
        cards:
        - type: map
          geo_location_sources:
          - metra_bnsf
          auto_fit: true
          hours_to_show: 0
          cluster: false
          theme_mode: auto
          scale_ruler: true
        - type: markdown
          entity_id:
          - sensor.metra_active_trains
          content: |-
            {%- from 'metra.jinja' import metra_active_trains -%}
            {{- metra_active_trains('BNSF') -}}
