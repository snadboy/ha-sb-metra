    hash: '#exp-upw-out'
    name: Metra UP-W · Outbound timetable
    icon: mdi:table-arrow-left
    cards:
    - type: markdown
      entity_id:
      - sensor.metra_schedule
      content: |-
        {%- from 'metra.jinja' import metra_timetable -%}
        {%- set ent = 'UP-W' -%}
        {{- metra_timetable(ent, 'outbound', limit=12) | safe -}}
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#exp-upw-stops'
    name: Metra UP-W · Stops · next inbound train
    icon: mdi:map-marker-path
    cards:
    - type: markdown
      entity_id:
      - sensor.metra_schedule
      content: |-
        {%- from 'metra.jinja' import metra_pattern_key, metra_timetable_data, metra_stops_table -%}
        {%- set line = 'UP-W' -%}
        {%- set pkey = metra_pattern_key(line) | trim -%}
        {%- set inb = metra_timetable_data(line, 'inbound', pkey) | from_json -%}
        {%- set nxt = inb | selectattr('departs','ge', now().strftime('%H:%M')) | first -%}
        {% if nxt %}{{- metra_stops_table(line, nxt.train, pkey) | safe -}}{% elif inb %}_No more inbound {{ line }} trains today._{% else %}_No inbound {{ line }} service today._{% endif %}
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#exp-upw-patterns'
    name: Metra UP-W · Service patterns
    icon: mdi:calendar-clock
    cards:
    - type: markdown
      entity_id:
      - sensor.metra_schedule
      content: |-
        {%- from 'metra.jinja' import metra_pattern_summary -%}
        {%- set ent = 'UP-W' -%}
        {{- metra_pattern_summary(ent) | safe -}}
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#exp-upw-calendar'
    name: Metra UP-W · Service calendar
    icon: mdi:calendar-range
    cards:
    - type: markdown
      entity_id:
      - sensor.metra_schedule
      content: |-
        {%- from 'metra.jinja' import metra_service_calendar -%}
        {%- set ent = 'UP-W' -%}
        {{- metra_service_calendar(ent) | safe -}}
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#exp-upw-data'
    name: Metra UP-W · Data macros
    icon: mdi:code-json
    cards:
    - type: markdown
      entity_id:
      - sensor.metra_active_trains
      - sensor.metra_schedule
      content: |-
        {%- from 'metra.jinja' import metra_pattern_key, metra_timetable_data, metra_pattern_summary_data, metra_service_calendar_data, metra_stops_table_data, metra_service_browser_data, metra_active_trains_data -%}
        {%- set line = 'UP-W' -%}
        {%- set pkey = metra_pattern_key(line) | trim -%}
        {%- set trains = metra_timetable_data(line, none, pkey) | from_json -%}
        {%- set live = metra_active_trains_data() | from_json -%}
        Every `metra_*_data` macro emits JSON; `from_json` turns it into a real list you can filter, sort and aggregate. Each takes a line **name** such as `'{{ line }}'`. Nothing below is reachable from the table macros.

        {% if not trains -%}
        _No schedule data for {{ line }}._
        {%- else -%}
        {%- set pats = metra_pattern_summary_data(line) | from_json -%}
        {%- set cal = metra_service_calendar_data(line) | from_json -%}
        {%- set b = metra_service_browser_data(line) | from_json -%}
        {%- set todays = pats | selectattr('key','eq',pkey) | list -%}
        {%- set today_lbl = (todays | first).label | title if todays else pkey -%}
        {%- set n_in = trains | selectattr('direction','eq','inbound') | list | count -%}
        {%- set n_out = (trains | count) - n_in -%}
        {%- set n_eve = trains | selectattr('departs','ge','17:00') | list | count -%}
        {%- set n_org = trains | map(attribute='origin') | unique | list | count -%}
        {%- set hs = namespace(h=[]) -%}
        {%- for t in trains %}{% set hs.h = hs.h + [t.departs[:2]] %}{% endfor -%}
        {%- set ns = namespace(best='', n=0) -%}
        {%- for h in hs.h | unique %}{% set c = hs.h | select('eq', h) | list | count %}{% if c > ns.n %}{% set ns.n = c %}{% set ns.best = h %}{% endif %}{% endfor -%}
        {%- set stopcounts = trains | map(attribute='stations') | map('length') | list -%}
        {%- set first_in = trains | selectattr('direction','eq','inbound') | first -%}
        {%- set st = (metra_stops_table_data(line, first_in.train, pkey) | from_json) if first_in else none -%}
        **Schedule · {{ line }}**

        | Derived from `metra_*_data` | |
        |:--|--:|
        | Today's service | {{ today_lbl }} |
        | Trains — inbound / outbound | {{ n_in }} / {{ n_out }} |
        | Busiest departure hour | {{ ns.best }}:00 — {{ ns.n }} trains |
        | Stops per train — fewest / most | {{ stopcounts | min }} / {{ stopcounts | max }} |
        | Departing 17:00 or later | {{ n_eve }} |
        | Distinct origins | {{ n_org }} |
        | First inbound train | {% if st %}#{{ st.train }} · {{ st.origin }} {{ st.departs }} → {{ st.destination }} {{ st.arrives }} · {{ st.stations | count }} stops{% else %}—{% endif %} |
        | Outlook | {{ b.first }} to {{ b.last }} · {{ cal | count }} service blocks · {{ b.patterns | count }} patterns |
        {%- endif %}

        {% if not live.trains -%}
        **Live · whole network** — _no Metra trains running right now._
        {%- else -%}
        {%- set cnt = namespace(best='', n=0) -%}
        {%- for l in live.lines %}{% set c = live.trains | selectattr('line','eq', l) | list | count %}{% if c > cnt.n %}{% set cnt.n = c %}{% set cnt.best = l %}{% endif %}{% endfor -%}
        {%- set timed = live.trains | selectattr('delay_min','number') | list -%}
        {%- set late = timed | sort(attribute='delay_min', reverse=true) | first -%}
        {%- set soon = live.trains | sort(attribute='eta') | first -%}
        **Live · whole network** — `metra_active_trains_data()` · updated {{ live.updated }}

        | Derived from live data | |
        |:--|--:|
        | Trains running | {{ live.trains | count }} on {{ live.trains | map(attribute='line') | unique | list | count }} of {{ live.lines | count }} lines |
        | Busiest line | {{ cnt.best }} — {{ cnt.n }} trains |
        | Most delayed | {% if late %}#{{ late.train }} {{ late.line }} · {{ '+' if late.delay_min > 0 }}{{ late.delay_min }}m before {{ late.next_station }}{% else %}—{% endif %} |
        | Running early | {{ timed | selectattr('delay_min','lt',0) | list | count }} |
        | Next arrival anywhere | #{{ soon.train }} {{ soon.line }} · {{ soon.next_station }} {{ soon.eta }} |
        {%- endif %}

        Each schedule train is a dict of `{{ trains[0].keys() | list | join('`, `') if trains else '—' }}`; each live train also carries `line` and `terminal_eta`.
cards: []
