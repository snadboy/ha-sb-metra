      heading_style: subtitle
      icon: mdi:timetable
    - type: markdown
      entity_id:
      - sensor.metra_active_trains
      - sensor.metra_schedule
      content: |-
        {%- from 'metra.jinja' import metra_timetable_grid -%}
        {{- metra_timetable_grid('HC', 'outbound', at=now().strftime('%H:%M')) -}}
      card_mod:
